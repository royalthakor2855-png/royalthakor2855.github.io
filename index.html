<!DOCTYPE html>
<html>
<head>
  <title>Devraj Edit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#111;
      color:white;
      text-align:center;
    }
    .top{
      background:red;
      padding:12px;
      font-size:20px;
      font-weight:bold;
    }
    .box{
      margin:20px;
    }
    a{
      display:block;
      margin:12px auto;
      padding:14px;
      max-width:320px;
      background:red;
      color:white;
      text-decoration:none;
      border-radius:8px;
      font-size:18px;
    }
    a:hover{opacity:0.8;}
    footer{
      color:#aaa;
      font-size:13px;
      margin:30px 0;
    }
  </style>
</head>

<body>

<div class="top">🔥 Devraj Edit Projects</div>

<div class="box" id="projects"></div>

<a href="https://youtube.com/@devrajedits96" target="_blank">
📺 YouTube Channel
</a>

<a href="https://whatsapp.com/channel/XXXXXXXX" target="_blank">
💬 WhatsApp Channel
</a>

<footer>© 2026 Devraj Edit • All Rights Reserved</footer>

<script>
const projectLinks = [
  "https://shrinkme.click/nW9E",
  "https://shrinkme.click/NEWLINK1",
  "https://shrinkme.click/NEWLINK2"
  "https://shrinkme.click/NEWLLNK3"
];

const box = document.getElementById("projects");

projectLinks.forEach((link, index) => {
  const a = document.createElement("a");
  a.href = link;
  a.target = "_blank";
  a.innerText = "🎬 Project " + (index + 1);
  box.appendChild(a);
});
</script>

</body>
</html>
